// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // ✅ Define versions centrally
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"  // Match your Expo modules-core requirement
        agpVersion = "8.7.2"      // Android Gradle Plugin
        reactNativeGradlePluginVersion = "0.76.3" // Match your RN version
    }

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // ✅ Specify versions explicitly
        classpath("com.android.tools.build:gradle:$agpVersion")
        classpath("com.facebook.react:react-native-gradle-plugin:$reactNativeGradlePluginVersion")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        
        // Optional: Expo autolinking plugin (if not managed by expo-cli)
        // classpath("expo:gradle-plugin:55.0.0")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"