# Project-wide Gradle settings.

# Increase memory significantly for RN 0.83 + New Arch
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError

# Disable parallel for now to stop competing downloads
org.gradle.parallel=false

# Disable daemon to prevent stale locked processes
org.gradle.daemon=false

# Enable caching to avoid re-downloading
org.gradle.caching=true

# Network timeouts
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=120000

# AndroidX
android.useAndroidX=true

# PNG crunching (keep for release)
android.enablePngCrunchInReleaseBuilds=true

# ✅ BUILD ONLY arm64-v8a FOR NOW (modern Android devices)
# Add others back only for Play Store release builds
reactNativeArchitectures=arm64-v8a

# New Architecture
newArchEnabled=true

# Hermes
hermesEnabled=true

# Edge to edge
edgeToEdgeEnabled=true

# Expo image support
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Legacy packaging
expo.useLegacyPackaging=false

org.gradle.parallel=false
